<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#1b1118">
    <title>Bar Companion</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <section class="character-stage" aria-labelledby="character-name">
        <div class="ambient-light" aria-hidden="true"></div>

        <div class="status-badge" id="status-badge">
          待機中
        </div>

        <form class="logout-form" action="/logout" method="post">
          <button class="logout-button" type="submit">
            ログアウト
          </button>
        </form>

        <figure class="character-card">
          <div class="character-frame" id="character-frame">
            <img
              class="character-background"
              id="character-background"
              src="assets/characters/chi-mama-background.png"
              alt=""
              aria-hidden="true"
            >
            <img
              class="character-foreground"
              id="character-image"
              src="assets/characters/chi-mama-foreground.png"
              alt="ちーママ"
            >
          </div>

          <figcaption class="character-name" id="character-name">
            ちーママ
          </figcaption>
        </figure>

        <section class="speech-panel" aria-labelledby="speech-title">
          <h2 class="visually-hidden" id="speech-title">音声入力</h2>
          <p class="speech-status" id="speech-status" aria-live="polite">
            言語を選び、「話す」を押してください
          </p>
          <p class="speech-transcript" id="speech-transcript" aria-live="polite">
            認識した言葉がここに表示されます
          </p>
          <div class="speech-controls">
            <label class="visually-hidden" for="speech-language">
              音声認識の言語
            </label>
            <select class="speech-language" id="speech-language">
              <option value="ja-JP">日本語</option>
              <option value="en-US">English</option>
            </select>
            <button class="speech-button" id="speech-button" type="button">
              話す
            </button>
          </div>
          <p class="voice-status" id="voice-status" aria-live="polite">
            話し方を選んで、声を試せます
          </p>
          <div class="voice-source-control">
            <label for="voice-name">端末の音声</label>
            <select class="voice-name" id="voice-name">
              <option value="">音声を読み込み中…</option>
            </select>
          </div>
          <div class="voice-controls">
            <label class="visually-hidden" for="voice-style">
              ちーママの話し方
            </label>
            <select class="voice-style" id="voice-style">
              <option value="calm">落ち着いた大人</option>
              <option value="friendly">明るく親しみやすい</option>
              <option value="low">少し低めで大人っぽい</option>
            </select>
            <button class="voice-test-button" id="voice-test-button" type="button">
              声を試す
            </button>
          </div>
        </section>

        <button
          class="motion-toggle"
          id="motion-toggle"
          type="button"
          aria-pressed="false"
        >
          動きを止める
        </button>
      </section>
    </main>
  </body>
</html>
