<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#1b1118">
    <title>Bar Companion</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <section class="character-stage" aria-labelledby="character-name">
        <div class="ambient-light" aria-hidden="true"></div>

        <div class="status-badge" id="status-badge">
          待機中
        </div>

        <form class="logout-form" action="/logout" method="post">
          <button class="logout-button" type="submit">
            ログアウト
          </button>
        </form>

        <figure class="character-card">
          <div class="character-frame" id="character-frame">
            <img
              class="character-background"
              id="character-background"
              src="assets/characters/chi-mama-background.png"
              alt=""
              aria-hidden="true"
            >
            <img
              class="character-foreground"
              id="character-image"
              src="assets/characters/chi-mama-foreground.png"
              alt="ちーママ"
            >
          </div>

          <figcaption class="character-name" id="character-name">
            ちーママ
          </figcaption>
        </figure>

        <button
          class="motion-toggle"
          id="motion-toggle"
          type="button"
          aria-pressed="false"
        >
          動きを止める
        </button>
      </section>
    </main>
  </body>
</html>
