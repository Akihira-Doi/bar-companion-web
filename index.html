<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#1b1118">
    <title>Bar Companion</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js?v=20260922-1" type="module"></script>
  </head>

  <body class="character-loading">
    <main class="app-shell">
      <section class="character-stage" aria-labelledby="character-name">
        <div class="ambient-light" aria-hidden="true"></div>

        <div class="status-badge" id="status-badge">
          待機中
        </div>

        <button
          class="settings-toggle"
          id="settings-toggle"
          type="button"
          aria-controls="settings-panel"
          aria-expanded="false"
        >
          <span aria-hidden="true">⚙︎</span>
          <span class="visually-hidden">設定を開く</span>
        </button>

        <figure class="character-card">
          <div class="character-frame" id="character-frame">
            <img
              class="character-background"
              id="character-background"
              src="assets/characters/chi-mama-background.png"
              alt=""
              aria-hidden="true"
            >
            <img
              class="character-foreground"
              id="character-image"
              src="assets/characters/chi-mama-foreground.png"
              alt="ちーママ"
            >
          </div>

          <figcaption class="visually-hidden" id="character-name">
            ちーママ
          </figcaption>
        </figure>

        <section class="speech-panel" aria-labelledby="speech-title">
          <h2 class="visually-hidden" id="speech-title">音声会話</h2>
          <p class="speech-status" id="speech-status" aria-live="polite">
            言語を選び、「話す」を押してください
          </p>
          <div class="conversation-log">
            <p class="conversation-line conversation-user">
              <span class="conversation-speaker">あなた</span>
              <span id="speech-transcript" aria-live="polite">
                認識した言葉がここに表示されます
              </span>
            </p>
            <p class="conversation-line conversation-character">
              <span class="conversation-speaker" id="reply-speaker">ちーママ</span>
              <span id="character-reply" aria-live="polite">
                話しかけてくれるのを待っています
              </span>
            </p>
          </div>
          <div class="speech-controls">
            <button class="speech-button" id="speech-button" type="button">
              話す
            </button>
          </div>
        </section>

        <button
          class="settings-backdrop"
          id="settings-backdrop"
          type="button"
          aria-label="設定を閉じる"
          hidden
        ></button>

        <aside
          class="settings-panel"
          id="settings-panel"
          aria-labelledby="settings-title"
          aria-hidden="true"
          hidden
        >
          <div class="settings-header">
            <h2 id="settings-title">会話設定</h2>
            <button
              class="settings-close"
              id="settings-close"
              type="button"
              aria-label="設定を閉じる"
            >
              ×
            </button>
          </div>

          <div class="settings-field">
            <label for="character-select">表示キャラクター</label>
            <select id="character-select">
              <option value="">キャラクターを読み込み中…</option>
            </select>
            <p class="character-status" id="character-status" aria-live="polite">
              登録済みのキャラクターを選べます
            </p>
          </div>

          <div class="settings-field settings-field-spaced">
            <label for="reaction-select">リアクション確認</label>
            <div class="reaction-controls">
              <select id="reaction-select">
                <option value="">登録なし</option>
              </select>
              <button id="reaction-test-button" type="button" disabled>
                動きを試す
              </button>
            </div>
          </div>

          <div class="settings-field settings-field-spaced">
            <label for="speech-language">会話する言語</label>
            <select class="speech-language" id="speech-language">
              <option value="ja-JP">日本語</option>
              <option value="en-US">English</option>
            </select>
          </div>

          <div class="settings-field settings-field-spaced">
            <label for="conversation-mode">マイクの操作方法</label>
            <select id="conversation-mode">
              <option value="automatic">最初だけ押して自動継続</option>
              <option value="push-to-talk">毎回押して話す</option>
            </select>
          </div>

          <div class="settings-field settings-field-spaced">
            <label for="speech-panel-position">会話パネルの位置</label>
            <select id="speech-panel-position">
              <option value="bottom">画面の下</option>
              <option value="top">画面の上</option>
            </select>
          </div>

          <p class="voice-status" id="voice-status" aria-live="polite">
            通常音声はOpenAI marinです
          </p>
          <div class="voice-source-control">
            <label for="voice-name">障害時の予備音声</label>
            <select class="voice-name" id="voice-name">
              <option value="">音声を読み込み中…</option>
            </select>
          </div>
          <div class="voice-controls">
            <label class="visually-hidden" for="voice-style">
              障害時の予備音声の話し方
            </label>
            <select class="voice-style" id="voice-style">
              <option value="calm">落ち着いた大人</option>
              <option value="friendly">明るく親しみやすい</option>
              <option value="low">少し低めで大人っぽい</option>
            </select>
            <button class="voice-test-button" id="voice-test-button" type="button">
              声を試す
            </button>
          </div>

          <form class="logout-form" action="/logout" method="post">
            <button class="logout-button" type="submit">
              ログアウト
            </button>
          </form>
        </aside>

        <button
          class="motion-toggle"
          id="motion-toggle"
          type="button"
          aria-pressed="false"
        >
          動きを止める
        </button>
      </section>
    </main>
  </body>
</html>
