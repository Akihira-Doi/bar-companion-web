<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#1b1118">
    <title>ログイン | Bar Companion</title>
    <link rel="stylesheet" href="login.css">
  </head>

  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <p class="login-kicker">Bar Companion</p>
        <h1 id="login-title">ちーママがお待ちです</h1>
        <p class="login-description">
          パスワードを入力してください。
        </p>

        <p class="login-error" id="login-error" role="alert" hidden>
          パスワードが違います。もう一度お試しください。
        </p>

        <form action="/login" method="post">
          <label for="password">パスワード</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            autofocus
          >
          <button type="submit">会いに行く</button>
        </form>
      </section>
    </main>

    <script src="login.js" defer></script>
  </body>
</html>
